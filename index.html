<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>GrayWorld</h2>

<label>
Grayscale
<input id="gray" type="range" min="0" max="100" value="100">
</label>

<br>

<label>
Contrast
<input id="contrast" type="range" min="50" max="200" value="140">
</label>

<br>

<label>
Brightness
<input id="brightness" type="range" min="50" max="150" value="100">
</label>

<br><br>

<button id="toggle">
Enable
</button>


<script type="module" src="main.js"></script>

</body>
</html>
